server {
    listen 80;
    listen [::]:80;
    server_name rotta.serradev.com;

    access_log /var/log/nginx/rotta-prelaunch.access.log;
    error_log /var/log/nginx/rotta-prelaunch.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "maintenance\n";
    }

    location / {
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        return 503 "ROTTA em preparacao. A coleta publica ainda nao esta habilitada.\n";
    }
}
