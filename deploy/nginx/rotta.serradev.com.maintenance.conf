server {
    listen 80;
    listen [::]:80;
    server_name rotta.serradev.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rotta.serradev.com;

    ssl_certificate /etc/letsencrypt/live/rotta.serradev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rotta.serradev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/rotta-prelaunch.access.log;
    error_log /var/log/nginx/rotta-prelaunch.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "maintenance\n";
    }

    location / {
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        return 503 "ROTTA em preparacao. A coleta publica ainda nao esta habilitada.\n";
    }
}
