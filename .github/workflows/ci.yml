name: CI

on:
  pull_request:
    branches:
      - chore/prelaunch-release-readiness
  push:
    branches:
      - chore/prelaunch-release-readiness

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rotta_prelaunch_test
          POSTGRES_USER: rotta_prelaunch_test
          POSTGRES_PASSWORD: local-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotta_prelaunch_test -d rotta_prelaunch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PRELAUNCH_DATA_PEPPER: ci-only-synthetic-pepper
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rotta_prelaunch_test
      DB_USERNAME: rotta_prelaunch_test
      DB_PASSWORD: local-only-test-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_pgsql, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client

      - name: Prepare isolated testing environment
        run: touch .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build production assets
        run: npm run build

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run PHP tests
        run: php artisan test
